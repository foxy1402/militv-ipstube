; MiliTV (IPSTube) clean-room open firmware
; Target hardware recovered by RE: ESP32-S3 (16 MB flash, 2 MB PSRAM),
; ST7789 240x320 IPS panel on SPI2, CH340 on COM8.
;
; The partition table is partitions.csv, which mirrors the FACTORY layout that
; is still on the device (app0 2.5 MB, a second app1 slot for OTA, 11 MB
; LittleFS). We never write a partition table when flashing, so the emitted
; image must agree with what the stock bootloader will actually walk.
[env:militv]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
board_build.partitions = partitions.csv
board_build.flash_mode = dio
board_build.flash_size = 16MB
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
monitor_speed = 115200
lib_deps =
    tzapu/WiFiManager
    links2004/WebSockets
    bblanchon/ArduinoJson
    h2zero/NimBLE-Arduino@^1.4.1
build_flags =
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=1
    ; Feature switches — set any to 0 to build a leaner image.
    -DMILITV_BLE=1
    -DMILITV_AUDIO=1
    -DMILITV_BATTERY=1
